[package]
name = "clawscope"
version = "0.2.0"
edition = "2021"
description = "CLI tool to inspect OpenClaw agent sessions"
license = "MIT"

[[bin]]
name = "clawscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jmespath = "0.5.0"
unicode-width = "0.2.3"
chrono = { version = "0.4", features = ["serde"] }
